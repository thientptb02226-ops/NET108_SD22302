version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ainative_postgres
    restart: always
    environment:
      POSTGRES_USER: ainative_user
      POSTGRES_PASSWORD: ainative_password
      POSTGRES_DB: ainative_commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ainative_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
